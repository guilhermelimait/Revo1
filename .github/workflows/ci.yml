name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  app:
    name: App tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pyflakes
      - run: python -m pyflakes revo1 tests
      - run: python -m unittest discover -s tests -v

  installer:
    name: Windows installer (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    # The x64 installer also runs on Windows on ARM; the native ARM64 build is
    # a bonus and must not block a release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
          cache: pip
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait
      - name: Build Revo1-Setup.exe
        shell: pwsh
        run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: dist/Revo1-Setup-*.exe
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Revo1-Setup-*.exe

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/managed_components
          key: pio-${{ hashFiles('firmware/platformio.ini', 'firmware/dependencies.lock') }}
      - run: pip install platformio "esptool>=5,<6"
      - run: pio run -d firmware
      - name: Merge into a single image flashed at 0x0
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::7}"
          build=firmware/.pio/build/waveshare-knob
          mkdir -p dist
          esptool --chip esp32s3 merge-bin -o "dist/revo1-firmware-$version.bin" \
            --flash-mode dio --flash-size 16MB \
            0x0 "$build/bootloader.bin" 0x8000 "$build/partitions.bin" 0x10000 "$build/firmware.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.bin
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
